 <div class="sectionTitle"><h2>첫 번째 의료 AI 프로젝트</h2><button class="ghost mini" onclick="nav('projects')">모든 프로젝트 ↗</button></div><div class="grid g3">${D.projects.slice(0,3).map(projectCard).join('')}</div><div class="notice">50주는 의료 AI 핵심 연구 일정입니다. 8개 강의 전체 완주와 모든 확장 프로젝트는 추가 기간을 두고 진행해요. 완주는 날짜보다 산출물과 이해도를 기준으로 판단합니다.</div>${mode==='local'?`<div class="setup">현재 단독 HTML 모드입니다. 노트·파일은 <b>이 브라우저의 기기 저장소</b>에 저장되며 다른 기기로 자동 동기화되지 않습니다. 연구노트의 ‘전체 백업’을 사용하세요.</div>`:''}`+footer()}
function weekPage(){const list=D.weeks.filter(w=>filter==='all'||String(w.phase)===filter).filter(w=>(w.title+w.concepts.join('')+w.lab).toLowerCase().includes(search.toLowerCase()));return heading('THE 50-WEEK RESEARCH CURRICULUM','한 주, 하나의 연구 질문.','강의 → 개념 → 논문 → Python 실습 → 산출물의 순서로 따라가세요.',`<button onclick="prep()">시작 전 준비 과정 ↗</button>`)+`<div class="toolbar"><div class="tabs">${[['all','전체'],...D.phases.map(p=>[String(p.id),'0'+p.id+' '+p.name])].map(([id,label])=>`<button class="${filter===id?'selected':''}" onclick="filter='${id}';render()">${label}</button>`).join('')}</div></div><div class="notice">주당 12–15시간 권장 · 이 표는 개인 연구 운영안이며 MIT 공식 강의 주차와 다릅니다. 주차를 누르면 선행 학습과 실제 강의 회차를 확인할 수 있어요.</div>${list.map(w=>`<div class="card week"><div class="weeknum">W${String(w.n).padStart(2,'0')}</div><div><button class="linkbutton" style="text-decoration:none" onclick="detail('${w.id}')"><h3>${w.title}</h3></button><p>${E(w.concepts.slice(0,4).join(' · '))}</p>${attached(w.id)}</div><div class="row"><span class="status">${done(w.id)?'완료':'학습 전'}</span>${check(w.id)}<button onclick="detail('${w.id}')" aria-label="${E(w.title)} 상세 열기">↗</button></div></div>`).join('')}`+footer()}

function projectPage(){let list=D.projects.filter(p=>filter==='all'||p.group===filter);return heading('QUESTIONS BECOME PROJECTS','모든 연구가 연결되어 있어요.','공유 대화의 중복 주제는 하나의 연구에 연결하고, 모든 활용 방향을 남겼습니다.')+`<div class="toolbar"><div class="tabs">${['all','의료 AI 핵심','행동실험','확장 연구','후속 연구'].map(s=>`<button class="${filter===s?'selected':''}" onclick="filter='${s}';render()">${s==='all'?'전체 '+D.projects.length:s}</button>`).join('')}</div></div><div class="grid g3">${list.map(projectCard).join('')}</div><div class="notice">현재 페이지는 연구 계획입니다. 데이터 수집·실험 실행·논문 재현이 완료된 상태는 아닙니다. B1–B5 행동실험은 우선 자기 파일럿·공개 데이터로 연습하고, 타인 모집 연구는 동의·필요한 윤리 검토를 거쳐 진행하세요.</div>`+footer()}

function courseExtras(id){const c=byid(id);openDialog(`<h2>${E(c.name)}</h2><p class="muted mini">강의 주제별 학습과 함께, 아래 원자료 항목까지 확인하세요.</p>${['전체 주제 학습·미녹화 대체 읽기','공식 Readings의 필수 자료','공식 문제·글쓰기·프로젝트 과제','공개 시험·복습·해설 자료','자신의 말로 개념 설명','연구 연결 노트·코드 결과물'].map((s,i)=>`<div class="learnRow">${check(id+'-extra'+i)}<div>${s}</div></div>`).join('')}<p><a href="${c.url}" target="_blank" rel="noopener">공식 자료에서 확인 ↗</a></p>`,'원강의 전체 수강 점검')}

function notesPage(){let list=records.filter(n=>n.kind==='note').sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));return heading('THE RESEARCH JOURNAL','질문, 실험, 그리고 발견의 기록.','강의·프로젝트에 연결해 노트와 파일을 함께 쌓으세요.',`<button class="primary" onclick="noteEditor()">＋ 연구노트 쓰기</button>`)+`<div class="toolbar"><button onclick="pickUpload('general')">＋ 파일 첨부</button><button onclick="exportBackup()">전체 백업 ↓</button><button onclick="$('#importInput').click()">백업 가져오기 ↑</button><span class="count">${list.length} NOTES · ${files.length} FILES</span></div>${mode==='local'?'<div class="setup">단독 파일 모드: 현재 브라우저에 저장합니다. 다른 기기에서는 전체 백업 JSON을 가져오세요. 브라우저 데이터 삭제 전 백업이 필요합니다.</div>':''}<div class="grid g3" style="margin-top:20px">${list.map(n=>`<article class="card noteCard"><div class="row between"><span class="smallcap">${E(n.target)} · ${E(n.type)}</span><span class="mini muted">${new Date(n.updatedAt).toLocaleDateString('ko')}</span></div><h3>${E(n.title)}</h3><p class="preview">${E(n.body)}</p><div class="row between" style="margin-top:16px"><span class="mini muted">첨부 ${filesFor(n.id).length}</span><button onclick="noteEditor('${E(n.target)}','${E(n.id)}')">노트 열기 ↗</button></div></article>`).join('')}</div>${list.length?'':`<div class="empty" style="margin-top:20px"><h3>아직 작성한 연구노트가 없어요.</h3><p>개념·논문·실험·NeuroAI 연결 노트 템플릿 중 골라 시작해요.</p><button onclick="noteEditor('w1')">첫 번째 노트 작성</button></div>`}<div class="sectionTitle"><h2>첨부한 모든 자료</h2></div><div class="card">${files.length?files.map(fileRow).join(''):'<p class="muted mini">PDF, 노트북, 코드, 이미지, 데이터 표 등을 첨부할 수 있어요. 파일당 20MB.</p>'}</div>`+footer()}
function titleOf(id){const x=byid(id);if(x)return x.title||x.name;const m=id.match(/^(c\w+)-l(\d+)$/);if(m){const c=byid(m[1]);return c?c.name.split(' · ')[0]+' · '+c.topics[+m[2]-1]:id}return id==='general'?'일반 연구노트':id}

function openDialog(body,title='학습·연구 상세',foot=''){const dialog=$('#detail');dialog.innerHTML=`<div class="modalHead"><span style="color:#97a58e">◌</span><h2>${title}</h2><button class="close" onclick="$('#detail').close()" aria-label="닫기">×</button></div><div class="modalBody">${body}</div>${foot?`<div class="modalFoot">${foot}</div>`:''}`;if(!dialog.open)dialog.showModal();dialog.scrollTop=0}
function resourcesList(ids){return ids.map(id=>{const r=D.resources.find(x=>x.id===id);return r?`<div class="learnRow"><span class="pill ${r.type==='논문'?'warm':''}">${r.type}</span><div><a href="${E(r.url)}" target="_blank" rel="noopener noreferrer">${E(r.title)} ↗</a><p>${E(r.task)}</p></div></div>`:''}).join('')}
function prerequisites(ids){return ids.length?ids.map(id=>`<button style="font-size:12px;margin:4px" onclick="detail('${id}')">${done(id)?'✓':'○'} ${E(titleOf(id))}</button>`).join(''):'<span class="mini muted">지금 시작할 수 있어요.</span>'}

 else if(k){body=`<span class="pill">${E(D.conceptGroups[x.group][0])}</span><h2 style="font-size:25px">${x.title}</h2><p>${E(x.explain)}</p><h3>권장 선행 학습</h3>${prerequisites(x.pre)}<h3>연결되는 실습</h3><button onclick="detail('w${x.week}')">W${String(x.week).padStart(2,'0')} 학습 계획 열기 ↗</button><h3>개념을 공부할 자료</h3>${resourcesList(x.resources)}<h3>설명해 볼 질문</h3><ol><li>이 개념의 정의와 가정을 예시 하나로 설명할 수 있는가?</li><li>입력·출력·단위 또는 측정 변수를 구분할 수 있는가?</li><li>실제 연구에서 어느 단계에 쓰이고 무엇을 잘못 해석하기 쉬운가?</li><li>코드·그래프·수식 중 하나로 작은 예제를 만들었는가?</li></ol>`}
 else if(r){body=`<span class="pill warm">${x.type} · ${x.source}</span><h2 style="font-size:23px">${x.title}</h2><p class="muted">${x.use}</p><a href="${x.url}" target="_blank" rel="noopener noreferrer">공식 자료·논문 원문 열기 ↗</a><h3>읽고 수행할 일</h3><p>${x.task}</p><h3>논문을 읽는 순서</h3><ol><li>초록·그림으로 질문과 결과의 구조를 파악</li><li>데이터·선정 기준·타깃·입력 변수 기록</li><li>방법·통계·분할·코드 설정 확인</li><li>재현 범위와 원문 대비 차이표 작성</li><li>실제 결과를 저장하고 한계·후속 질문 정리</li></ol><div class="notice">원문 링크를 제공하며 모든 논문 PDF를 미리 내려받아 첨부한 상태는 아닙니다. 접근 가능한 원문과 본인이 가진 자료를 아래에 연결하세요.</div>`}
 body+=`<h3>연결된 노트와 자료</h3><div class="row"><button onclick="noteEditor('${id}')">＋ 연구노트</button><button onclick="pickUpload('${id}')">＋ 자료 업로드</button></div><div id="detailFiles">${filesFor(id).map(fileRow).join('')}</div>${notesFor(id).map(n=>`<div class="learnRow"><button class="linkbutton" onclick="noteEditor('${id}','${n.id}')">✎ ${E(n.title)}</button></div>`).join('')}`;

function lectureLinks(spec){return spec.split(',').map(part=>{const [id,range]=part.split(':'),c=byid(id);if(!c)return'';const [a,b]=range.split('-').map(Number);return`<div class="learnRow"><div><button class="linkbutton" onclick="detail('${id}')">${E(c.name)} ↗</button><p>회차 ${range} · ${Array.from({length:(b||a)-a+1},(_,i)=>c.topics[a+i-1]).filter(Boolean).map(E).join(' / ')}</p></div></div>`}).join('')}
async function saveRecord(r){if(mode==='unavailable')throw Error('이 환경은 읽기 전용입니다.');const saved=mode==='cloud'?await api('record',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}):{...r,updatedAt:new Date().toISOString()};if(mode==='local')await localOp('records','put',saved);records=records.filter(x=>x.id!==saved.id);records.push(saved);return saved}
async function toggle(id){if(busy)return;busy=true;try{await saveRecord({id:'progress_'+id,kind:'progress',target:id,done:!done(id)});render();toast(done(id)?'완료 상태를 저장했어요.':'완료 표시를 취소했어요.');if($('#detail').open){const btn=$('#detail .modalFoot .primary');if(btn)btn.textContent=done(id)?'✓ 완료됨 · 취소하기':'학습·연구 완료 표시';}}catch(e){toast(e.message)}finally{busy=false}}
const templates={개념:'# 핵심 개념\n\n정의와 예시:\n선행 개념:\n실험적 근거·출처:\n\n# 이해 확인\n직접 설명하거나 그려 본 내용:\n헷갈리는 부분:\n\n# 다음 질문\n',논문:'# 논문 정보\n제목·저자·연도·DOI:\n\n# 연구 질문과 가설\n\n# 데이터와 변수\n대상·선정 기준·표본 수·버전:\n입력·타깃·교란 변수:\n\n# 방법과 결과\n분할·전처리·모델·평가 단위:\n실제 결과(실행 전에는 미실행):\n\n# 비판적 검토\n한계·누수·불확실성:\n재현 범위·원문과 다른 점:\n\n# 다음 실험\n',실험:'# 연구 질문\n\n# 사전 분석계획\n주평가지표·가설·제외 기준:\n데이터 버전·대상 ID·분할:\n\n# 실행 기록\n코드·환경·seed·파라미터:\n전처리·품질 점검:\n\n# 실제 결과\n상태: 아직 실행하지 않음\n수치·그림·오류 로그:\n\n# 해석과 한계\n예상과 달랐던 점:\n\n# 다음 단계\n',NeuroAI:'# 연결할 인지·신경 현상\n\n# AI 모델과 비교 가설\n인지 메커니즘과 모델을 동일시하지 않기:\n\n# 공정한 비교 조건\n자극·학습 경험·평가 단위·독립 검증:\n\n# 표현·오류·강건성 결과\n상태: 아직 실행하지 않음\n\n# 후속 질문\n'};
function noteEditor(target='general',id=null){if($('#editor').open){toast('현재 노트를 저장하거나 닫은 뒤 새 노트를 열어주세요.');return}const n=records.find(x=>x.id===id);editId=id||uid();noteTarget=target;const options=[['general','일반 연구노트'],...D.weeks.map(x=>[x.id,'W'+x.n+' '+x.title]),...D.projects.map(x=>[x.id,x.id+' '+x.title]),...D.courses.map(x=>[x.id,x.name]),...D.resources.map(x=>[x.id,x.title])];if(!options.some(x=>x[0]===target))options.unshift([target,titleOf(target)]);
 $('#editor').innerHTML=`<div class="modalHead"><h2>${n?'연구노트 수정':'새 연구노트'}</h2><button class="close" aria-label="노트 닫기" onclick="closeEditor()">×</button></div><div class="modalBody editor"><label for="noteTitle">노트 제목</label><input id="noteTitle" value="${E(n?.title||titleOf(target)+' · 학습 기록')}" maxlength="200"><div class="grid g2"><div><label for="noteContext">연결 항목</label><select id="noteContext">${options.map(([v,t])=>`<option value="${E(v)}" ${v===(n?.target||target)?'selected':''}>${E(t)}</option>`).join('')}</select></div><div><label for="noteType">노트 종류</label><select id="noteType">${Object.keys(templates).map(t=>`<option ${t===n?.type?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="row between" style="margin-top:15px"><label for="noteBody" style="margin:0">연구 내용 · Markdown 텍스트</label><button class="mini" onclick="insertTemplate()">선택한 템플릿 추가</button></div><textarea id="noteBody" spellcheck="false">${E(n?.body||templates['개념'])}</textarea><p class="mini muted">저장 버튼을 눌러야 내용이 반영됩니다. 이미 첨부한 파일은 노트 ID에 연결되어 유지돼요.</p><div class="row"><button onclick="pickUpload('${editId}')">＋ 파일 첨부</button><button onclick="downloadNote()">Markdown 내려받기 ↓</button></div><div id="editorFiles">${filesFor(editId).map(fileRow).join('')}</div><p id="saveError" class="mini error"></p></div><div class="modalFoot"><span id="savedAt" class="mini muted">${n?'마지막 저장 '+new Date(n.updatedAt).toLocaleString('ko'):'작성한 뒤 저장해주세요.'}</span><button id="saveNote" class="primary" style="margin-left:auto" onclick="saveNote()">노트 저장</button></div>`;$('#editor').dataset.initial=JSON.stringify([$('#noteTitle').value,$('#noteBody').value,$('#noteContext').value,$('#noteType').value]);$('#editor').showModal();$('#noteTitle').focus();$('#editor').oncancel=e=>{const now=JSON.stringify([$('#noteTitle').value,$('#noteBody').value,$('#noteContext').value,$('#noteType').value]);if(now!==$('#editor').dataset.initial&&!confirm('저장하지 않은 변경사항이 있어요. 닫을까요?'))e.preventDefault()};}
function closeEditor(){const now=JSON.stringify([$('#noteTitle').value,$('#noteBody').value,$('#noteContext').value,$('#noteType').value]);if(now!==$('#editor').dataset.initial&&!confirm('저장하지 않은 변경사항이 있어요. 닫을까요?'))return;$('#editor').close()}
function insertTemplate(){$('#noteBody').value+='\n\n'+templates[$('#noteType').value]}
async function saveNote(){const title=$('#noteTitle').value.trim();if(!title){$('#saveError').textContent='제목을 입력해주세요.';return}const btn=$('#saveNote');btn.disabled=true;btn.textContent='저장 중…';try{const n=await saveRecord({id:editId,kind:'note',target:$('#noteContext').value,type:$('#noteType').value,title,body:$('#noteBody').value});$('#editor').dataset.initial=JSON.stringify([title,n.body,n.target,n.type]);$('#savedAt').textContent='저장됨 · '+new Date(n.updatedAt).toLocaleString('ko');$('#saveError').textContent='';render();toast('연구노트를 저장했어요.')}catch(e){$('#saveError').textContent=e.message}finally{btn.disabled=false;btn.textContent='노트 저장'}}
function pickUpload(target){uploadTarget=target;$('#fileInput').value='';$('#fileInput').click()}
async function upload(){const selected=Array.from($('#fileInput').files);for(const file of selected){if(file.size>20*1024*1024){toast(file.name+' · 20MB를 초과합니다.');continue}const meta={id:uid(),name:file.name,target:uploadTarget,type:file.type,uploadedAt:new Date().toISOString(),size:file.size};try{let saved;if(mode==='cloud')saved=await api('file/'+meta.id,{method:'PUT',headers:{'x-file-meta':encodeURIComponent(JSON.stringify(meta))},body:file});else if(mode==='local'){await localOp('files','put',{...meta,blob:file});saved={...meta,blob:file}}else throw Error('읽기 전용 환경입니다.');files.push(saved);toast(file.name+' 첨부 완료')}catch(e){toast(file.name+' 저장 실패: '+e.message)}}render();if($('#editor').open)$('#editorFiles').innerHTML=filesFor(editId).map(fileRow).join('');if($('#detail').open&&$('#detailFiles'))$('#detailFiles').innerHTML=filesFor(uploadTarget).map(fileRow).join('')}
async function downloadFile(id){try{const f=files.find(x=>x.id===id);let blob;if(mode==='cloud'){const r=await fetch('/api/file/'+id);if(!r.ok)throw Error('파일 다운로드에 실패했습니다.');blob=await r.blob()}else{const full=await localOp('files','get',id);blob=full.blob}download(blob,f.name)}catch(e){toast(e.message)}}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function downloadNote(){download(new Blob(['# '+$('#noteTitle').value+'\n\n'+$('#noteBody').value],{type:'text/markdown;charset=utf-8'}),$('#noteTitle').value.replace(/[^\w가-힣 -]/g,'_')+'.md')}
function attachments(id,title){openDialog(`<h2>${E(title)}</h2><p class="muted mini">이 항목에 연결된 자료와 노트입니다.</p><div class="row"><button onclick="pickUpload('${id}')">＋ 파일 첨부</button><button onclick="noteEditor('${id}')">＋ 노트 쓰기</button></div><div id="detailFiles">${filesFor(id).map(fileRow).join('')}</div>${notesFor(id).map(n=>`<p><button class="linkbutton" onclick="noteEditor('${id}','${n.id}')">${E(n.title)}</button></p>`).join('')}`,'자료·노트')}
async function exportBackup(){toast('노트와 첨부파일을 백업하고 있어요…');try{const fs=[];for(const f of files){let blob;if(mode==='cloud'){const r=await fetch('/api/file/'+f.id);if(!r.ok)throw Error(f.name+' 백업 실패');blob=await r.blob()}else blob=(await localOp('files','get',f.id)).blob;const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)});const {blob:ignored,...meta}=f;fs.push({...meta,data})}download(new Blob([JSON.stringify({format:'neuro-lab-backup-v1',exportedAt:new Date().toISOString(),records,files:fs},null,2)],{type:'application/json'}),'Neuro_Lab_Backup_'+new Date().toISOString().slice(0,10)+'.json');toast('전체 백업을 내려받았어요.')}catch(e){toast(e.message)}}
async function importBackup(){const file=$('#importInput').files[0];if(!file)return;try{const b=JSON.parse(await file.text());if(b.format!=='neuro-lab-backup-v1'||!Array.isArray(b.records)||!Array.isArray(b.files)||b.records.length>10000||b.files.length>1000)throw Error('지원하지 않는 백업 형식입니다.');if(!confirm(`노트·진도 ${b.records.length}개, 파일 ${b.files.length}개를 가져올까요? 같은 ID는 백업 내용으로 갱신됩니다.`))return;let n=0;for(const r of b.records){if(!/^[\w-]{1,100}$/.test(r.id)||!['note','progress'].includes(r.kind))throw Error('잘못된 백업 항목입니다.');await saveRecord(r);n++}for(const f of b.files){if(!/^[\w-]{1,100}$/.test(f.id)||typeof f.data!=='string'||!f.data.startsWith('data:')||typeof f.name!=='string'||f.name.length>255||!/^[\w-]{1,100}$/.test(f.target))throw Error('잘못된 파일 백업입니다.');const comma=f.data.indexOf(','),raw=atob(f.data.slice(comma+1)),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(bytes.length>20*1024*1024)throw Error('백업 파일이 20MB를 초과합니다.');const blob=new Blob([bytes],{type:f.type}),{data,...meta}=f;const saved=mode==='cloud'?await api('file/'+f.id,{method:'PUT',headers:{'x-file-meta':encodeURIComponent(JSON.stringify(meta))},body:blob}):{...meta,blob};if(mode==='local')await localOp('files','put',saved);files=files.filter(x=>x.id!==f.id);files.push(saved)}render();toast('백업 가져오기가 완료됐어요.')}catch(e){toast('가져오기 중 중단: '+e.message+' · 일부 항목은 이미 저장됐을 수 있습니다.')}finally{$('#importInput').value=''}}
function makePrompt(id){const p=byid(id);const text=`내 Neuro Research Lab의 ${p.id} ‘${p.title}’ 프로젝트를 시작하자.\n공유 대화의 의료 AI 연구 흐름을 유지하고, 선행 개념부터 설명해줘.\n연구 질문: ${p.question}\n진행 단계: ${p.steps.join(' → ')}\n관련 자료: ${p.resources.map(r=>D.resources.find(x=>x.id===r)?.url).filter(Boolean).join('\n')}\n\n이번 회차에는 배경 개념, 읽을 논문 부분, 실제 데이터 접근 방법, 실행 가능한 Python 코드, 예상 결과와 실제 결과의 구분, 완료 기준을 순서대로 알려줘.\n마지막에는 홈페이지에 올릴 개념·논문·실험·NeuroAI 연결 노트 초안을 만들어줘. 아직 실행하지 않은 결과나 수치를 만들어내지 마.\n현재 진도·보유 데이터·오류 로그는 다음과 같아: [여기에 작성]`;openDialog(`<p>아래 요청문에 현재 진도와 보유 자료를 적어 대화에 붙여넣으면 이어서 연구할 수 있어요.</p><div class="prompt" id="researchPrompt">${E(text)}</div><button style="margin-top:15px" onclick="download(new Blob([$('#researchPrompt').textContent],{type:'text/plain;charset=utf-8'}),'${id}_research_prompt.txt')">요청문 내려받기 ↓</button>`,'다음 연구를 함께 진행하기')}
function prep(){openDialog(`<h2>연구를 시작하기 전, 작은 준비 과정</h2><p class="muted">기초가 이미 익숙하면 건너뛰고 W01로 가세요. 부족한 부분만 2–6주 추가해도 괜찮아요.</p>${[['Python·Jupyter','변수·함수·파일 → NumPy 배열 → pandas 표 → matplotlib 그림','CSV를 읽고 결측률과 분포를 설명한다.','python'],['확률·통계','분포 → 조건부확률 → 추정·검정 → 회귀·불확실성','두 집단 차이를 효과크기와 CI로 표현한다.','stats'],['선형대수·미분','벡터·행렬 → 최소제곱 → 고유값·SVD → 미분·gradient','회귀와 PCA 입력/출력을 차원으로 설명한다.','math'],['연구 환경·재현성','가상환경 → Git → README → 데이터/코드/결과 분리','환경·데이터 버전·seed를 기록하고 다시 실행한다.','sklearn']].map(([t,s,g,r],i)=>`<div class="card" style="margin-top:12px"><div class="row">${check('prep'+i)}<h3>${t}</h3></div><p class="mini">${s}</p><p class="mini muted">완료 기준: ${g}</p><button class="mini" onclick="detail('${r}')">학습자료 열기 ↗</button></div>`).join('')}<div class="notice">기초 준비 뒤 W01 → W02 → Stroop 파일럿 → N-back → P1 순서로 시작하세요. 핵심 프로젝트를 마친 뒤 확장 연구를 추가합니다.</div>`,'시작 전 준비')}
function mapPage(){return heading('THE CONNECTED RESEARCH ATLAS','배움의 순서를 지도로 펼쳐요.','각 노드를 누르면 선행 학습·자료·실습·완료 기준이 열립니다.')+`<div class="toolbar"><div class="tabs">${[['weeks','50주 연구 흐름'],['concepts','개념 연결 지도'],['projects','프로젝트 연결']].map(([id,t])=>`<button class="${mapType===id?'selected':''}" onclick="mapType='${id}';zoom=1;render()">${t}</button>`).join('')}</div>${mapType==='concepts'?`<select aria-label="개념 분야" onchange="mapGroup=this.value;render()"><option value="all">모든 개념 분야</option>${D.conceptGroups.map((g,i)=>`<option value="${i}" ${String(i)===mapGroup?'selected':''}>${g[0]}</option>`).join('')}</select>`:''}<button onclick="setZoom(-.15)" aria-label="지도 축소">−</button><span class="mini">${Math.round(zoom*100)}%</span><button onclick="setZoom(.15)" aria-label="지도 확대">＋</button><span class="count">${mapType==='concepts'?D.concepts.length+' CONCEPTS':mapType==='weeks'?'50 WEEKS':D.projects.length+' PROJECTS'}</span></div><div class="graphWrap" id="graphWrap"><div class="graph" id="graph"></div></div><div class="notice">연결선은 권장 선행 학습과 연구 순서입니다. 모든 노드를 동시에 수행할 필요는 없어요. 가로·세로 스크롤과 확대/축소로 살펴보세요. 개념 지도는 분야별 필터로 집중할 수 있습니다.</div>`+footer()}
function setZoom(delta){zoom=Math.min(1.6,Math.max(.4,zoom+delta));render()}
function drawMap(){const nodes=[],edges=[],labels=[];let width=1160,height=1500;if(mapType==='weeks'){D.phases.forEach((p,i)=>{labels.push({x:25+i*225,y:25,t:'0'+p.id+' · '+p.name});const ws=D.weeks.filter(w=>w.phase===p.id);ws.forEach((w,j)=>{nodes.push({id:w.id,title:w.title,sub:'WEEK '+String(w.n).padStart(2,'0'),x:25+i*225,y:70+j*95});w.pre.forEach(from=>edges.push([from,w.id]));});});height=70+12*95+40;}
 else if(mapType==='concepts'){const groups=D.conceptGroups.map((g,i)=>i).filter(i=>mapGroup==='all'||String(i)===mapGroup);const columns=mapGroup==='all'?4:1;width=mapGroup==='all'?1160:600;height=mapGroup==='all'?3200:1800;groups.forEach((gi,idx)=>{const col=idx%columns,row=Math.floor(idx/columns),x=25+col*280,y=40+row*1570;labels.push({x,y:y-15,t:D.conceptGroups[gi][0]});D.concepts.filter(c=>c.group===gi).forEach((c,j)=>{nodes.push({id:c.id,title:c.title,sub:'CONCEPT · W'+c.week+'+',x,y:y+30+j*86});c.pre.forEach(from=>edges.push([from,c.id]));});});}
 else{width=1160;height=1760;const groups=['행동실험','의료 AI 핵심','확장 연구','후속 연구'];groups.forEach((g,i)=>{labels.push({x:25+i*280,y:25,t:g});D.projects.filter(p=>p.group===g).forEach((p,j)=>{nodes.push({id:p.id,title:p.title,sub:p.id+' · '+p.when,x:25+i*280,y:70+j*205});});});const pairs=[['P1','P2'],['P2','P3'],['P3','P4'],['P4','P5'],['B2','N2'],['B3','N8'],['B5','N7'],['P2','N1'],['P3','N3'],['P4','N7'],['P5','X1'],['P5','X2']];edges.push(...pairs);}
 const pos=Object.fromEntries(nodes.map(n=>[n.id,n]));const graph=$('#graph');graph.style.width=width*zoom+'px';graph.style.height=height*zoom+'px';graph.innerHTML=`<div style="width:${width}px;height:${height}px;transform:scale(${zoom});transform-origin:top left;position:relative"><svg viewBox="0 0 ${width} ${height}" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#b0bfaa"/></marker></defs>${edges.map(([a,b])=>{const n=pos[a],m=pos[b];if(!n||!m)return'';let x1=n.x+100,y1=n.y+65,x2=m.x+100,y2=m.y;const mid=(y1+y2)/2;return`<path d="M${x1} ${y1} C${x1} ${mid},${x2} ${mid},${x2} ${y2}" fill="none" stroke="#c6d3bf" stroke-width="1" marker-end="url(#arrow)"/>`}).join('')}</svg>${labels.map(l=>`<div class="mapLabel" style="left:${l.x}px;top:${l.y}px">${E(l.t)}</div>`).join('')}${nodes.map(n=>`<button class="node ${done(n.id)?'done':''}" style="left:${n.x}px;top:${n.y}px" onclick="detail('${n.id}')"><small>${E(n.sub)} ${done(n.id)?'· ✓':''}</small>${E(n.title)}</button>`).join('')}</div>`;}
function coverage(){return heading('SCOPE, SOURCES & REPRODUCTION','빠진 연결이 없는지 확인해요.','대화에서 나온 내용, 보강한 기초, 아직 확정할 자료를 구분합니다.')+`<div class="card"><span class="pill warm">원문 확인 ${D.provenance.checked}</span><h2>기준이 된 공유 대화</h2><a href="${D.provenance.url}" target="_blank" rel="noopener">${D.provenance.title} 전체 대화 ↗</a><p>${D.provenance.scope}</p><p class="mini muted">${D.provenance.reproduction}</p></div><div class="sectionTitle"><h2>대화 속 주제 → 홈페이지 연결</h2></div><div class="card coverage"><table><thead><tr><th>공유 대화 항목</th><th>연결 항목</th><th>진행 기준</th></tr></thead><tbody>${[['의료 AI 핵심 5개','P1–P5','50주 핵심 과정'],['행동실험 5개','B1–B5','3–7주 파일럿, 이후 통계·모델 확장'],['시각피질–AI 비교','N1','자극 대응 fMRI + RSA'],['EEG 주의·인지상태','N3','이벤트가 있는 별도 데이터'],['인간–AI 작업기억','B2 → N2','동일 과제·보지 않은 시퀀스 검증'],['생물학적 뉴런 계산','N4','9.40 전체 목록과 연결'],['베이즈·강화학습 의사결정','B5 + 9.66J','파라미터/모델 회복'],['인지저하·치매 의료 AI','P1–P5','환자 단위 검증·교란·한계'],['인지 원리 기반 AI 개선','N7','주의·기억·ablation·지속학습'],['착시·가림·노이즈 비교','B3 → N8','사람·모델 비교 조건 맞춤'],['종단·다중모달 연구','X1','같은 환자·방문 연결 및 접근 승인'],['HCI·BCI·로보틱스·계산정신의학','X2','응용별 추가 데이터와 전문지식 필요'],['8개 강의 전체 경로','강의실','전체 공개 주제 + 필수 읽기·과제 점검'],['매주 노트·자료 업로드','모든 상세 카드','개념·논문·실험·NeuroAI 노트 + 파일']].map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="grid g2" style="margin-top:20px"><div class="card"><h3>범위와 학습 시간</h3><p class="mini">50주 × 12–15시간은 의료 AI 중심 운영안입니다. 원강의 8개 전체, 모든 읽기·과제, 18개 연구를 전부 완성하려면 추가 기간이 필요해요. 9.66J·9.40·BMM을 한두 주에 완주하는 계획으로 해석하지 않습니다.</p><p class="mini">기초 준비 2–6주 → 핵심 50주 → 원강의 미완료·확장 연구를 자신의 속도로 진행하세요. 원래 대화의 96주 언급은 큰 방향으로 보존하되 상세 운영은 최종 50주 안을 기준으로 정리했습니다.</p></div><div class="card"><h3>자료 상태와 미확정 항목</h3><p class="mini">고정된 OCW 공개 목록과 논문 서지는 공식 출처로 대조했습니다. BCS 튜토리얼 전체 아카이브는 고정 수강 목록이 아니어서 선정 학습 묶음을 표시했습니다. 일부 논문의 상세 본문·코드·유료 접근은 연구 시작 시 추가 확인이 필요합니다.</p><p class="mini">ADNI 접근, 후속 fMRI/주의 데이터의 정확한 ID·버전, 원문 코드 가용성은 확보 완료로 표시하지 않았습니다. 논문 PDF·실제 연구 결과는 첨부 전 상태입니다.</p></div></div><div class="sectionTitle"><h2>공식 자료 확인 경로</h2></div><div class="card">${D.courses.map(c=>`<p class="mini"><a href="${c.url}" target="_blank" rel="noopener">${c.name} ↗</a></p>`).join('')}<p class="mini muted">이 사이트의 한국어 목록은 학습을 위한 요약·재구성입니다. 공식 회차·읽기·과제·자료 가용성은 연결한 원문이 기준입니다.</p></div>`+footer()}
function globalSearch(){const q=$('#globalSearch').value.trim().toLowerCase();if(!q){$('#searchResults').innerHTML='';return}const pool=[...D.weeks.map(x=>({...x,kind:'W'+x.n})),...D.projects.map(x=>({...x,kind:x.id})),...D.concepts.map(x=>({...x,kind:'개념'})),...D.courses.map(x=>({...x,title:x.name,kind:'강의'})),...D.resources.map(x=>({...x,kind:x.type}))];const matches=pool.filter(x=>(x.title+' '+(x.concepts||[]).join(' ')).toLowerCase().includes(q)).slice(0,25);$('#searchResults').innerHTML=matches.length?matches.map(x=>`<button onclick="$('#searchResults').innerHTML='';detail('${x.id}')"><span class="pill">${x.kind}</span> ${E(x.title)}</button>`).join(''):'<p class="mini muted" style="padding:15px">검색 결과가 없습니다.</p>'}
window.addEventListener('click',e=>{if(!e.target.closest('#globalSearch,#searchResults'))$('#searchResults').innerHTML=''});
window.addEventListener('beforeunload',e=>{if($('#editor').open){const now=JSON.stringify([$('#noteTitle').value,$('#noteBody').value,$('#noteContext').value,$('#noteType').value]);if(now!==$('#editor').dataset.initial){e.preventDefault();e.returnValue=''}}});
init();
</script></body></html>
